name: Build & Deploy

on:
  push:
    branches: [main]
  # マージ後にしか検査が走らないと、壊れたものが main に入ってから気付くことになる
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 配信は決して途中で止めない。プルリクエストの検査だけ、古い実行を捨てる
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # package.json の volta.node と揃える
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      # build は tsc --noEmit を通してから vite build する
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
